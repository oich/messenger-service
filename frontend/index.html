<!DOCTYPE html>
<html lang="de">
  <head>
    <!-- Dark/light mode before first paint (@hub/ui useTheme, key hub_theme, default dark) -->
    <script>try{var m=localStorage.getItem('hub_theme')||'dark';if(m==='dark'||(m==='system'&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){document.documentElement.classList.add('dark')}</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messenger - AESystek Hub</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- KI-Zauberstab: shared Web-Component, vom Hub ausgeliefert (einmal bauen, ueberall nutzen) -->
    <script defer src="%VITE_HUB_URL%/ki-wand.js" data-ki-assistant-url="%VITE_HUB_URL%:8087"></script>
  </body>
</html>
